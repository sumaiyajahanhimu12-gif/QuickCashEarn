<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCashEarn Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>QuickCashEarn</h1>

    <h2 id="welcomeText">Loading...</h2>

    <hr>

    <p>
        <strong>Coin Balance:</strong>
        <span id="coinBalance">0</span>
    </p>

    <p>
        <strong>Referral Code:</strong>
        <span id="referralCode">Loading...</span>
    </p>

    <p>
        <strong>Consecutive Active Days:</strong>
        <span id="activeDays">0</span>
    </p>

    <p>
        <strong>Email Verification:</strong>
        <span id="emailStatus">Checking...</span>
    </p>

    <hr>

    <button onclick="window.location.href='tasks.html'">
        📋 View Tasks
    </button>

    <br><br>

    <button onclick="window.location.href='referrals.html'">
        👥 My Referrals
    </button>

    <br><br>

    <button onclick="window.location.href='withdraw.html'">
        💰 Withdraw
    </button>

    <br><br>

    <button onclick="window.location.href='history.html'">
        📜 Withdraw History
    </button>

    <br><br>

    <button id="logoutBtn">
        🚪 Logout
    </button>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
