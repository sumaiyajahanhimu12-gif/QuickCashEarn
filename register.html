<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QuickCashEarn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="text" id="telegramId" placeholder="Telegram ID" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <input type="text" id="referralCode" placeholder="Referral Code (Optional)"><br><br>
        <button id="registerBtn">Register</button>
        <p id="regMsg" style="color:red;"></p>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
