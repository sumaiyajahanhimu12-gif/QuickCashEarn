<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - QuickCashEarn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <button onclick="window.location.href='dashboard.html'">← Dashboard</button>
        <h1>💰 Withdraw Coins</h1>

        <div class="task-card">
            <h3>Current Balance</h3>
            <p style="font-size:24px;font-weight:bold;"><span id="coinBalance">0</span> Coins</p>
        </div>

        <div class="task-card">
            <p>✅ Minimum: <strong>50,000 Coins</strong></p>
            <p>✅ Period: <strong>1 - 10 Date</strong></p>
            <p>✅ Active Days: <strong>14+</strong></p>
            <p>✅ Referrals: <strong>10+</strong></p>
            <p>✅ Top 10 Referral Coins: <strong>100,000+</strong></p>
            <p>✅ Email Verified Required</p>
        </div>

        <h2>Payment Method</h2>
        <select id="method">
            <option value="bkash">Bkash</option>
            <option value="nagad">Nagad</option>
            <option value="rocket">Rocket</option>
        </select>
        <br><br>
        <input type="text" id="number" placeholder="01XXXXXXXXX">
        <br><br>
        <input type="number" id="amount" placeholder="Coin Amount">
        <br><br>
        <button id="withdrawBtn">🚀 Submit Withdraw</button>
        <p id="withdrawMsg" style="color:red;"></p>
        <br>
        <button onclick="window.location.href='history.html'">📜 History</button>
    </div>
    <script type="module" src="js/withdraw.js"></script>
</body>
</html>
